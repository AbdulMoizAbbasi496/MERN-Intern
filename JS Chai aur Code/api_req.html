    a {

<body>

    // ✅USING fetch()

    fetch(req_url).then((response) => {

        return data
    }).then((data) => {

        document.querySelector('h2').innerHTML += `${data.bio}`;
        document.querySelector('a').href = `${data.html_url}`;
